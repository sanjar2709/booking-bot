[tool.ruff]
line-length = 120
target-version = 'py312'
extend-exclude = ['migrations']

[tool.ruff.lint]
select = ['E', 'W', 'F', 'I', 'B', 'UP', 'SIM', 'ASYNC']

[tool.ruff.lint.isort]
known-first-party = ['apps', 'core']

[tool.ruff.lint.per-file-ignores]
# Translations read better as one line per text
'core/locales/*' = ['E501']
